<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>LOGIN SYSTEM</p>
    <form id="loginForm">
        <label>Username</label>
        <input id="user" placeholder="Enter Username"><br><br>
        <label>Password</label>
        <input id="password" placeholder="Enter password"><br><br>
        <div>
        <button onclick="login()" type="submit">Login</button>
        </div>
    </form>
</body>
<script>
    function login(){
    if (user.value==='admin' && password.value === '1234'){
        document.write('Login Successful');

    }else if(user.value==='tanisha' && password.value==='5678'){
        document.write('Login Successful');
    }else if(user.value==='sonu' && password.value==='4321'){
        document.write('Login Successful');
    }

    else {
        document.write('Invalid Credentials');
    }
}

</script>

</html>
